# Ejecución del experimento. Los comandos se corren DESDE ESTA CARPETA:
#
#   docker compose build
#   docker compose run --rm tfg python -m pytest -q
#   docker compose run --rm tfg python scripts/extraer_snapshot.py
#   docker compose run --rm tfg python main.py inspeccionar
#   docker compose run --rm tfg python main.py ejecutar
#
# Se monta el repositorio ENTERO en /repo, no solo esta carpeta. Hacen falta dos
# cosas que viven un nivel más arriba: el directorio `.git`, del que el
# manifiesto saca el commit que generó los números (RN-6), y el que necesita el
# control de confidencialidad para saber qué archivos se publicarían.
#
# Los datos y las salidas quedan dentro del montaje, así que persisten fuera del
# contenedor sin necesidad de volúmenes adicionales.

services:
  tfg:
    build: .
    image: motor-pronostico-novapack
    volumes:
      - ..:/repo
    working_dir: /repo/motor-pronostico-novapack
    environment:
      # Credenciales de la extracción. Se leen del entorno del host; nunca se
      # escriben en este archivo ni en el repositorio.
      TFG_DB_HOST: "${TFG_DB_HOST:-host.docker.internal}"
      TFG_DB_PORT: "${TFG_DB_PORT:-}"
      TFG_DB_NAME: "${TFG_DB_NAME:-}"
      TFG_DB_USER: "${TFG_DB_USER:-}"
      TFG_DB_PASSWORD: "${TFG_DB_PASSWORD:-}"
    extra_hosts:
      # El túnel a la base vive en el host, no en la red de Docker.
      - "host.docker.internal:host-gateway"

  # ---------------------------------------------------------------------------
  # Tablero: visor Streamlit de solo lectura sobre salidas*/.
  #
  #   docker compose up tablero        ->  http://localhost:8501
  #
  # El montaje es :ro a propósito — el tablero VISUALIZA corridas; ejecutarlas
  # sigue siendo `docker compose run --rm tfg python main.py ejecutar`. Así el
  # pipeline queda como única fuente de verdad y la interfaz no puede tocar ni
  # los datos ni las salidas (RN-1/RN-6).
  # ---------------------------------------------------------------------------
  tablero:
    build:
      context: .
      dockerfile: Dockerfile.tablero
    image: motor-pronostico-tablero
    ports:
      - "8501:8501"
    volumes:
      - ..:/repo:ro
    working_dir: /repo/motor-pronostico-novapack
