# Visor del experimento — nginx sirviendo la SPA + los artefactos de salidas*/.
#
# REGLA DE SEGURIDAD (Anexo B): bajo /datos/ SOLO se sirven los directorios de
# corridas (salidas*). Todo lo demás del repositorio montado —en particular
# datos/crudo/ (el snapshot confidencial) y config/extraccion.local.yaml (el
# esquema interno)— responde 403 aunque el archivo exista en el montaje.
# La verificación de esta regla es parte de la entrega (curl esperando 403).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- La SPA -------------------------------------------------------------
    location / {
        try_files $uri /index.html;
    }

    # --- Descubrimiento de corridas ------------------------------------------
    # Listado JSON del directorio del proyecto: expone SOLO NOMBRES de entradas
    # (el control de confidencialidad garantiza que ningún nombre es interno).
    # El frontend filtra los que empiezan con "salidas".
    location = /datos/ {
        alias /repo/motor-pronostico-novapack/;
        autoindex on;
        autoindex_format json;
    }

    # --- Artefactos de las corridas ------------------------------------------
    location ~ ^/datos/(salidas[^/]*)(/.*)?$ {
        alias /repo/motor-pronostico-novapack/$1$2;
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-cache";
    }

    # --- Todo lo demás del montaje: prohibido --------------------------------
    location /datos/ {
        return 403;
    }
}
