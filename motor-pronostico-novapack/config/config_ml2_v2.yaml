# =============================================================================
# CORRIDA EXPLORATORIA ML2 — V2: la respuesta a los hallazgos de la V1
# =============================================================================
# La V1 (config_ml2.yaml, salidas_ml2/) midió que el sesgo de la pérdida
# domina sobre la arquitectura (todas las redes subestimaron) y que el motor
# se degrada al crecer el menú de candidatos con selección a un paso. La V2
# aplica las cuatro correcciones que esos números piden:
#
#   1. Pérdida TWEEDIE en las cuatro redes (la jugada ganadora de LightGBM,
#      con su potencia declarada).
#   2. TFT con exógenas estáticas (categoría/canal/regional) + mes calendario.
#   3. Chronos con calibración de sesgo (un factor global, estimado en
#      validación — análogo a la parada temprana; la prueba queda intacta).
#   4. Motor con selección MULTIHORIZONTE (el mecanismo pre-registrado del
#      estudio: elegir con la misma mecánica con la que se evalúa).
#
# El experimento DOCUMENTADO (config.yaml, salidas/) no se toca.
# =============================================================================

datos:
  archivo: "datos/crudo/ventas_novapack.csv"
  columnas:
    fecha: "fecha"
    sku: "sku"
    canal: "canal"
    regional: "regional"
    cantidad: "cantidad"
    categoria: "categoria"
    precio: "precio"
    perdidas: "perdidas"
  separador: ","
  codificacion: "utf-8"

periodo:
  mes_inicio_gestion: 4
  inicio: "2017-04"
  fin: "2026-03"

poblacion:
  categorias:
    - "PLASTICOS"
    - "PAPELES"
    - "PAPEL FOTOCOPIA"
    - "ESCRITURA Y TRAZADO"
    - "CUADERNOS"

particion:
  fin_entrenamiento: "2024-03"
  fin_validacion: "2025-03"

series:
  devoluciones: "descartar"
  rellenar_ceros_intermedios: true

evento_exogeno:
  nombre: "covid19"
  desde: "2020-03"
  hasta: "2021-02"
  tratamiento: "copiar_gestion_previa"

inclusion:
  historial_minimo_meses: 36
  proporcion_maxima_ceros: 0.70
  volumen_minimo_unidades: 50

modelos:
  activos:
    - naive_m1
    - naive_m1_gf
    - ma_2
    - ma_2_gf
    - ma_12
    - ma_12_gf
    - exp_smooth_opt
    - holt_winters
    - croston
    - lightgbm
    # --- brazos ML2 ---
    - dlinear
    - nhits
    - deepar
    - tft
    - chronos
    - motor

  benchmark_promedio_movil: "ma_12"
  benchmark_naive: "naive_m1"

  exp_smooth:
    alfa_min: 0.05
    alfa_max: 0.95
    alfa_paso: 0.05

  holt_winters:
    periodo_estacional: 12
    alfa_rejilla: [0.1, 0.2, 0.3, 0.5, 0.7, 0.9]
    beta_rejilla: [0.0, 0.05, 0.1, 0.2]
    gamma_rejilla: [0.0, 0.05, 0.1, 0.2]

  croston:
    alfa_rejilla: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4]

  lightgbm:
    objective: "tweedie"
    tweedie_variance_power: 1.464977652919245
    metric: "tweedie"
    learning_rate: 0.05310654167584386
    num_leaves: 137
    min_data_in_leaf: 61
    feature_fraction: 0.5778124801487501
    bagging_fraction: 0.870285300844084
    bagging_freq: 1
    lambda_l2: 24.468189902436567
    num_boost_round: 3000
    early_stopping_rounds: 100
    seed: 20260406
    num_threads: 1
    deterministic: true
    force_row_wise: true
    verbosity: -1

  # --- Brazos neuronales (neuralforecast) ------------------------------------
  # Entrenamiento ÚNICO sobre el bloque de entrenamiento con parada temprana
  # contra validación (la misma excepción que LightGBM); horizonte directo 12.
  # V1 UNIVARIANTE: sin exógenas — se mide arquitectura, no features. Semilla
  # fija; el entrenamiento en GPU no es bit a bit reproducible entre hardware
  # distinto y se declara.
  neuronales:
    semilla: 20260408
    horizonte: 12
    input_size: 24
    max_steps: 1500
    # La potencia Tweedie del campeón (declarada por la búsqueda de LightGBM).
    tweedie_rho: 1.464977652919245
    dlinear:
      perdida: "tweedie"
      moving_avg_window: 13
    nhits:
      perdida: "tweedie"
    deepar:
      # La binomial negativa colapsó en la V1 (sesgo −74,6 %): misma
      # verosimilitud que el resto para aislar la arquitectura.
      perdida: "tweedie"
    tft:
      perdida: "tweedie"
      hidden_size: 64
      exogenas:
        mes: true
        estaticas: ["categoria", "canal", "regional"]

  # --- Brazo fundacional (Chronos-Bolt) --------------------------------------
  # Cero-shot: pesos públicos, inferencia local, sin fine-tuning. La media
  # pronosticada como punto (no la mediana — la lección Tweedie).
  chronos:
    checkpoint: "amazon/chronos-bolt-base"
    contexto_maximo: 96
    lote: 256
    # V2: factor de sesgo global estimado en validación (la V1 midió WMAPE
    # competitivo con subestimación sistemática de −20 %).
    calibrar: true

  motor_regla: "mae_mas_bias"
  # V2: la ventana de selección pre-registrada que corrige la maldición del
  # ganador medida en la V1 (acierto 20,7 % → 12,3 % al pasar de 11 a 15
  # candidatos con selección a un paso).
  motor_seleccion: "multihorizonte"

features:
  rezagos: [1, 2, 3, 6, 12]
  ventanas_moviles: [3, 6, 12]
  incluir_mes: true
  incluir_anio: true
  incluir_tendencia: true
  categoricas: ["sku", "canal", "regional"]
  v2:
    categoria: true
    precio: true
    perdidas: true
    quiebres: true
    tipo_cambio: true
    derivadas: true
  tc_regimen_fijo: 6.96
  archivo_quiebres: "datos/crudo/quiebres.csv"
  archivo_tipo_cambio: "datos/crudo/tipo_cambio.csv"

multihorizonte:
  activo: true
  horizonte_maximo: 12
  origenes: "rodantes"
  reentrenar_lightgbm: true

lightgbm_tuning:
  semilla: 20260408
  n_trials: 60
  fold_desde: "2023-04"
  fold_hasta: "2024-03"
  num_boost_round: 3000
  early_stopping_rounds: 100
  espacio:
    objective: ["regression_l1", "regression_l2", "tweedie"]
    tweedie_variance_power: [1.1, 1.6]
    learning_rate: [0.02, 0.12]
    num_leaves: [15, 255]
    min_data_in_leaf: [10, 200]
    feature_fraction: [0.5, 1.0]
    bagging_fraction: [0.5, 1.0]
    lambda_l2: [0.0, 30.0]

pruebas:
  alfa: 0.05
  alternativa: "less"
  metrica_contraste: "error_compuesto_unidades"
  shapiro_n_maximo: 5000
  semilla: 20260406

figuras:
  dpi: 300
  escala_grises: true
  formato: "png"

salidas:
  directorio: "salidas_ml2_v2"
