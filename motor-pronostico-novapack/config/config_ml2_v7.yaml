# =============================================================================
# CORRIDA EXPLORATORIA ML2 — V7: el menú anti-régimen (prueba g2026)
# =============================================================================
# La corrida de blindaje midió el talón de Aquiles de la mezcla: gana el año
# normal CANCELANDO sesgos opuestos, pero en el año de quiebre (g2025) TODO
# el menú sobre-pronostica (+7..+35) y no queda nada que cancelar — la mezcla
# cae de 67,8 a 90,2 mientras el naive (78,7) y N-HiTS (72,6) lideran.
#
# HIPÓTESIS V7: un menú con diversidad de sesgo DELIBERADA resiste el quiebre.
# Se agregan al menú los dos brazos que el blindaje señaló:
#   - nhits: el brazo de sesgo negativo persistente (−17,8 en g2026; −7,1 y
#     LÍDER a un paso en g2025) — el contrapeso estructural del menú.
#   - naive_m1: el brazo que se re-ancla cada mes (sesgo −3,6 / −0,9) — la
#     adaptividad pura que el año de quiebre premia.
# Riesgo declarado: en el año normal ambos son brazos débiles (85,6 y 84,0)
# y el promedio simple los traga sin ponderar — el costo de la robustez se
# MIDE, no se supone. Las tres reglas de mezcla (prom/pond/h) comparten el
# menú nuevo: la comparación aísla la regla, como siempre.
#
# ATRIBUCIÓN LIMPIA: todo lo demás queda EXACTO a la V5 (sin el calendario de
# la V6, que es una palanca aparte ya medida con sus contrapartidas): la única
# variable contra la línea base V5 es el MENÚ. La gemela de esta corrida
# (config_ml2_v7_blindaje.yaml) repite el cambio sobre el protocolo desplazado
# (prueba g2025) contra la línea base del blindaje. V1-V6 intactas.
# =============================================================================

datos:
  archivo: "datos/crudo/ventas_novapack.csv"
  columnas:
    fecha: "fecha"
    sku: "sku"
    canal: "canal"
    regional: "regional"
    cantidad: "cantidad"
    categoria: "categoria"
    precio: "precio"
    perdidas: "perdidas"
  separador: ","
  codificacion: "utf-8"

periodo:
  mes_inicio_gestion: 4
  inicio: "2017-04"
  fin: "2026-03"

poblacion:
  categorias:
    - "PLASTICOS"
    - "PAPELES"
    - "PAPEL FOTOCOPIA"
    - "ESCRITURA Y TRAZADO"
    - "CUADERNOS"

particion:
  fin_entrenamiento: "2024-03"
  fin_validacion: "2025-03"

series:
  devoluciones: "descartar"
  rellenar_ceros_intermedios: true

evento_exogeno:
  nombre: "covid19"
  desde: "2020-03"
  hasta: "2021-02"
  tratamiento: "copiar_gestion_previa"

inclusion:
  historial_minimo_meses: 36
  proporcion_maxima_ceros: 0.70
  volumen_minimo_unidades: 50

modelos:
  activos:
    - naive_m1
    - naive_m1_gf
    - ma_2
    - ma_2_gf
    - ma_12
    - ma_12_gf
    - exp_smooth_opt
    - holt_winters
    - croston
    - lightgbm
    # --- brazos ML2 ---
    - lightgbm_directo
    - dlinear
    - nhits
    - tft
    - chronos
    # --- segunda etapa (usan los pronósticos de los demás) ---
    - mezcla_prom
    - mezcla_pond
    - mezcla_h
    - motor

  benchmark_promedio_movil: "ma_12"
  benchmark_naive: "naive_m1"

  exp_smooth:
    alfa_min: 0.05
    alfa_max: 0.95
    alfa_paso: 0.05

  holt_winters:
    periodo_estacional: 12
    alfa_rejilla: [0.1, 0.2, 0.3, 0.5, 0.7, 0.9]
    beta_rejilla: [0.0, 0.05, 0.1, 0.2]
    gamma_rejilla: [0.0, 0.05, 0.1, 0.2]

  croston:
    alfa_rejilla: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4]

  lightgbm:
    objective: "tweedie"
    tweedie_variance_power: 1.464977652919245
    metric: "tweedie"
    learning_rate: 0.05310654167584386
    num_leaves: 137
    min_data_in_leaf: 61
    feature_fraction: 0.5778124801487501
    bagging_fraction: 0.870285300844084
    bagging_freq: 1
    lambda_l2: 24.468189902436567
    num_boost_round: 3000
    early_stopping_rounds: 100
    seed: 20260406
    num_threads: 1
    deterministic: true
    force_row_wise: true
    verbosity: -1

  # --- Brazos neuronales (neuralforecast) ------------------------------------
  # Config idéntica a la V4: las mejores MEDIDAS en prueba de cada arquitectura
  # (la búsqueda V3 no transfirió por el quiebre de régimen del pliegue).
  neuronales:
    semilla: 20260408
    horizonte: 12
    input_size: 24
    max_steps: 1500
    tweedie_rho: 1.464977652919245
    dlinear:
      perdida: "mae"
      moving_avg_window: 13
    nhits:
      perdida: "mae"
    tft:
      perdida: "tweedie"
      hidden_size: 64
      exogenas:
        mes: true
        estaticas: ["categoria", "canal", "regional"]

  # --- Brazo fundacional (Chronos-Bolt) --------------------------------------
  chronos:
    checkpoint: "amazon/chronos-bolt-base"
    contexto_maximo: 96
    lote: 256
    calibrar: "categoria"

  # --- Mezcladores ------------------------------------------------------------
  # V7: el menú de la V4-V5 MÁS los dos brazos de diversidad de sesgo que el
  # blindaje señaló (nhits = contrapeso estructural; naive_m1 = adaptividad
  # pura). Las tres reglas comparten el menú: la comparación aísla la regla.
  # Sin lightgbm_directo (a un paso duplica a lightgbm y sesgaría el promedio).
  mezclador:
    candidatos:
      - lightgbm
      - chronos
      - exp_smooth_opt
      - holt_winters
      - tft
      - nhits
      - naive_m1

  motor_regla: "mae_mas_bias"
  motor_seleccion: "multihorizonte"

features:
  rezagos: [1, 2, 3, 6, 12]
  ventanas_moviles: [3, 6, 12]
  incluir_mes: true
  incluir_anio: true
  incluir_tendencia: true
  categoricas: ["sku", "canal", "regional"]
  v2:
    categoria: true
    precio: true
    perdidas: true
    quiebres: true
    tipo_cambio: true
    derivadas: true
  tc_regimen_fijo: 6.96
  archivo_quiebres: "datos/crudo/quiebres.csv"
  archivo_tipo_cambio: "datos/crudo/tipo_cambio.csv"

multihorizonte:
  activo: true
  horizonte_maximo: 12
  origenes: "rodantes"
  reentrenar_lightgbm: true
  # V5: el directo también re-entrena por origen (árboles congelados del
  # ajuste base por horizonte) — separa recursión de re-entrenamiento.
  reentrenar_directo: true

pruebas:
  alfa: 0.05
  alternativa: "less"
  metrica_contraste: "error_compuesto_unidades"
  shapiro_n_maximo: 5000
  semilla: 20260406

figuras:
  dpi: 300
  escala_grises: true
  formato: "png"

salidas:
  directorio: "salidas_ml2_v7"
